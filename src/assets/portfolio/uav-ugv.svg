<svg xmlns="http://www.w3.org/2000/svg" viewBox="200 90 1200 675">
  <!-- Top-down sketch of the Inter IIT UAV-guided UGV task: a hovering drone's
       camera segments the road, and the ground vehicle follows the mean path
       with pure-pursuit steering toward a look-ahead point. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16263d"/>
      <stop offset="1" stop-color="#0b1422"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.56" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#4fd2f0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4fd2f0" stop-opacity="0"/>
    </radialGradient>
    <path id="road" d="M -40 760 C 260 760, 380 560, 640 520 S 1060 560, 1220 380 S 1480 140, 1660 120"/>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- terrain contours -->
  <g fill="none" stroke="#9fb3c8" stroke-opacity="0.08" stroke-width="2">
    <path d="M-50 120 C 250 50, 450 190, 760 110 S 1300 20, 1650 100"/>
    <path d="M-50 210 C 260 140, 480 280, 780 200 S 1310 120, 1650 190"/>
    <path d="M-50 300 C 270 240, 500 360, 800 290 S 1320 220, 1650 280"/>
    <path d="M-50 640 C 220 600, 300 860, 620 800 S 1100 700, 1650 820"/>
    <path d="M-50 860 C 260 830, 420 960, 700 900 S 1200 820, 1650 900"/>
    <path d="M1250 600 C 1350 520, 1500 560, 1650 520"/>
    <path d="M1180 700 C 1320 620, 1480 660, 1650 620"/>
  </g>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- road, with its segmentation mask -->
  <use href="#road" fill="none" stroke="#4fd2f0" stroke-opacity="0.55" stroke-width="128" stroke-linecap="round"/>
  <use href="#road" fill="none" stroke="#1d2a3f" stroke-width="122" stroke-linecap="round"/>
  <use href="#road" fill="none" stroke="#4fd2f0" stroke-opacity="0.13" stroke-width="122" stroke-linecap="round"/>

  <!-- extracted mean path -->
  <use href="#road" fill="none" stroke="#e2e8f0" stroke-opacity="0.75" stroke-width="3" stroke-dasharray="18 16"/>

  <!-- drone camera field of view projected on the ground -->
  <g stroke="#4fd2f0" stroke-width="2" fill="none" stroke-dasharray="8 10" stroke-opacity="0.5">
    <path d="M905 255 L430 405 M905 255 L1010 405 M905 255 L430 690 M905 255 L1010 690"/>
  </g>
  <rect x="430" y="405" width="580" height="285" rx="6" fill="#4fd2f0" fill-opacity="0.05"
        stroke="#4fd2f0" stroke-opacity="0.7" stroke-width="2.5" stroke-dasharray="14 10"/>

  <!-- pure-pursuit look-ahead -->
  <path d="M531 548 L818 507" stroke="#ff8a3d" stroke-width="4" stroke-linecap="round"/>
  <circle cx="818" cy="507" r="13" fill="#ff8a3d"/>
  <circle cx="818" cy="507" r="26" fill="none" stroke="#ff8a3d" stroke-opacity="0.45" stroke-width="3"/>

  <!-- ground vehicle -->
  <g transform="translate(531 548) rotate(-19.5)">
    <rect x="-34" y="-31" width="18" height="10" rx="3" fill="#0b1422"/>
    <rect x="16" y="-31" width="18" height="10" rx="3" fill="#0b1422"/>
    <rect x="-34" y="21" width="18" height="10" rx="3" fill="#0b1422"/>
    <rect x="16" y="21" width="18" height="10" rx="3" fill="#0b1422"/>
    <rect x="-46" y="-25" width="92" height="50" rx="11" fill="#ff8a3d"/>
    <rect x="10" y="-18" width="26" height="36" rx="6" fill="#ffd9bf" fill-opacity="0.75"/>
  </g>

  <!-- drone, seen from above -->
  <g transform="translate(905 255)">
    <g stroke="#cbd5e1" stroke-width="11" stroke-linecap="round">
      <path d="M-62 -62 L62 62 M62 -62 L-62 62"/>
    </g>
    <g fill="#4fd2f0" fill-opacity="0.14" stroke="#4fd2f0" stroke-width="3">
      <circle cx="-66" cy="-66" r="34"/>
      <circle cx="66" cy="-66" r="34"/>
      <circle cx="-66" cy="66" r="34"/>
      <circle cx="66" cy="66" r="34"/>
    </g>
    <rect x="-30" y="-30" width="60" height="60" rx="15" fill="#e2e8f0"/>
    <circle r="10" fill="#0b1422"/>
    <circle r="4" fill="#4fd2f0"/>
  </g>

  <!-- labels -->
  <g font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="34">
    <text x="1012" y="266" fill="#cbd5e1">UAV camera</text>
    <text x="1075" y="600" fill="#86e3f7">segmented road</text>
    <text x="760" y="462" fill="#ffb27f">look-ahead</text>
    <text x="462" y="668" fill="#ffb27f">UGV</text>
  </g>
</svg>
